# Local / single-server deployment: app + PostgreSQL with a persistent volume.
#   cp .env.example .env   # then edit the values
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lingualoop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
      POSTGRES_DB: ${POSTGRES_DB:-lingualoop}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lingualoop} -d ${POSTGRES_DB:-lingualoop}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lingualoop}:${POSTGRES_PASSWORD:-change-me-db-password}@db:5432/${POSTGRES_DB:-lingualoop}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PORT: ${PORT:-3000}
      # Empty = secure cookies (production default). Set COOKIE_SECURE=false only for plain-HTTP testing.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    ports:
      - "127.0.0.1:${HOST_PORT:-3020}:${PORT:-3000}"

volumes:
  pgdata:
